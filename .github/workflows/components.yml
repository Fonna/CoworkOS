name: Publish runtime components
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-runtime-components
  cancel-in-progress: false
jobs:
  components:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run components:pack:public
      - run: node scripts/prepare-component-sources.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish verified components and corresponding sources
        run: npm run components:publish
        env:
          GH_TOKEN: ${{ secrets.COMPONENTS_RELEASE_TOKEN }}
