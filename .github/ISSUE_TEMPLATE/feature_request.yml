name: Feature request / 功能建议
description: Describe a user workflow or a development improvement.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User workflow and problem / 用户流程与问题
      description: Describe the task and current limitation.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Proposed behavior / 期望行为
      description: Include a concrete example and how success can be checked.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Related modules or roadmap / 相关模块与路线图
      description: If known, link the relevant capability, code-map entry or roadmap item.
